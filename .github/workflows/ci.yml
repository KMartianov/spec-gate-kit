name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip pytest

      - name: Python CLI tests (pytest)
        run: python3 -m pytest config/bin/tests -q

      - name: Gate plugin tests (node --test)
        run: node --test config/plugins/__tests__/spec-gate.test.ts

      - name: Contract lint (all active specs)
        run: |
          python3 config/bin/docs-lint --spec audit-chain-p0
          python3 config/bin/docs-lint --spec p0-portability-sprint
          python3 config/bin/docs-lint --spec portable-evidence-paths-p0

      - name: Portability — shipped config snapshot
        run: python3 config/tools/gov/check_portability.py config

      - name: Portability — paths (no author-home literal; blocking)
        run: python3 config/tools/gov/check_portability.py paths

      - name: Installer smoke (install into a temp target)
        run: bash install.sh --target "$RUNNER_TEMP/kit-target"
