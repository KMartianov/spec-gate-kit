name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: python3 -m pip install --upgrade pip pytest

      - name: Python CLI tests (pytest)
        run: python3 -m pytest config/bin/tests -q

      - name: Gate plugin tests (node --test)
        run: node --test config/plugins/__tests__/spec-gate.test.ts

      - name: Contract lint (this sprint)
        run: python3 config/bin/docs-lint --spec p0-portability-sprint

      - name: Portability — shipped config snapshot
        run: python3 config/tools/gov/check_portability.py config

      # Non-blocking ON PURPOSE: `paths` still reports exactly one occurrence —
      # config/command/spec-approve.md:9 — which sits in the kit's deny zone and
      # may be edited by a human only (GOV-2). Do not hide it with `|| true`;
      # the failure stays visible in the log.
      - name: Portability — paths (expected non-zero until human edit)
        continue-on-error: true
        run: python3 config/tools/gov/check_portability.py paths
